[workspace]
resolver = "2"
members = [
    "crates/relay-core",
    "crates/relay-ipc",
    "crates/relay-discovery",
    "crates/relay-adapters",
    "crates/relay-control",
    "crates/relay-agent",
    "crates/relay-shim",
    "crates/relay-gui",
]
default-members = [
    "crates/relay-core",
    "crates/relay-ipc",
    "crates/relay-discovery",
    "crates/relay-adapters",
    "crates/relay-control",
    "crates/relay-agent",
    "crates/relay-shim",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
relay-core = { path = "crates/relay-core" }
relay-ipc = { path = "crates/relay-ipc" }
relay-discovery = { path = "crates/relay-discovery" }
relay-adapters = { path = "crates/relay-adapters" }
relay-control = { path = "crates/relay-control" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "6"
getrandom = "0.2"
dotenvy = "0.15"
sha2 = "0.10"
