name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - name: Install GUI dev libs
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features 2>&1 | tee test-output.txt

      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          if [ ! -f test-output.txt ]; then
            echo "::error::no test output was captured"
            exit 0
          fi
          grep -E '^test .* FAILED$' test-output.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -E 'panicked at|assertion .* failed|left:|right:|Caused by:|Os \{ code' test-output.txt \
            | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
