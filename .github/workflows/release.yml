name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - name: Install GUI dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo audit

  build-macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build app and dmg
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION 2>/dev/null || echo '')"
          if [ -n "$FILE_VERSION" ] && [ "$FILE_VERSION" != "$APP_VERSION" ]; then
            echo "::warning::VERSION file ($FILE_VERSION) does not match tag ($APP_VERSION); stamping the tag."
          fi
          echo "building version $APP_VERSION"
          ./build_app.sh

      - name: Verify dmg
        run: |
          MOUNT_DIR="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
            rmdir "$MOUNT_DIR" || true
          }
          trap cleanup EXIT
          hdiutil attach build/VSCRelay.dmg -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          test -d "$MOUNT_DIR/VSCRelay.app"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/VSCRelay.dmg
          if-no-files-found: error

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust + musl
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl

      - name: Install build deps (musl + GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxrandr-dev libfontconfig1-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build linux tarball
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          echo "building linux tarball $APP_VERSION (static musl)"
          ./build_linux.sh x86_64-unknown-linux-musl

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build windows zip
        shell: pwsh
        run: |
          $env:APP_VERSION = "${{ github.ref_name }}".TrimStart('v')
          ./build_windows.ps1

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p build
          cp artifacts/macos-dmg/VSCRelay.dmg build/
          cp artifacts/linux-tarball/*.tar.gz build/
          cp artifacts/linux-tarball/*.deb build/
          cp artifacts/windows-zip/*.zip build/

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: build/VSCRelay.spdx.json
          upload-artifact: false

      - name: Generate checksums
        run: |
          cd build
          sha256sum VSCRelay.dmg *.tar.gz *.deb *.zip VSCRelay.spdx.json > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/VSCRelay.dmg
            build/*.tar.gz
            build/*.deb
            build/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: VS Code Agent Relay ${{ github.ref_name }}
          files: |
            build/VSCRelay.dmg
            build/*.tar.gz
            build/*.deb
            build/*.zip
            build/SHA256SUMS
            build/VSCRelay.spdx.json
          generate_release_notes: true
