name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Build app and dmg
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION 2>/dev/null || echo '')"
          if [ -n "$FILE_VERSION" ] && [ "$FILE_VERSION" != "$APP_VERSION" ]; then
            echo "::warning::VERSION file ($FILE_VERSION) does not match tag ($APP_VERSION); stamping the tag."
          fi
          echo "building version $APP_VERSION"
          ./build_app.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: VS Code Agent Relay ${{ github.ref_name }}
          files: build/VSCRelay.dmg
          generate_release_notes: true
