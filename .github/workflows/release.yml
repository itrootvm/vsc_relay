name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo audit

      - name: Build app and dmg
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION 2>/dev/null || echo '')"
          if [ -n "$FILE_VERSION" ] && [ "$FILE_VERSION" != "$APP_VERSION" ]; then
            echo "::warning::VERSION file ($FILE_VERSION) does not match tag ($APP_VERSION); stamping the tag."
          fi
          echo "building version $APP_VERSION"
          ./build_app.sh

      - name: Verify dmg
        run: |
          MOUNT_DIR="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
            rmdir "$MOUNT_DIR" || true
          }
          trap cleanup EXIT
          hdiutil attach build/VSCRelay.dmg -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          test -d "$MOUNT_DIR/VSCRelay.app"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: build/VSCRelay.spdx.json
          upload-artifact: false

      - name: Generate checksums
        run: |
          cd build
          shasum -a 256 VSCRelay.dmg VSCRelay.spdx.json > SHA256SUMS

      - name: Attest dmg provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/VSCRelay.dmg

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: VS Code Agent Relay ${{ github.ref_name }}
          files: |
            build/VSCRelay.dmg
            build/SHA256SUMS
            build/VSCRelay.spdx.json
          generate_release_notes: true
